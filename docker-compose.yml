version: "3.8"
services:
  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./nginx/ssl:/etc/nginx/ssl"
    depends_on:
      - estudo-client-api-golang
  estudo-client-api-golang:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # Mapeia a porta do container para a porta local
    restart: always
